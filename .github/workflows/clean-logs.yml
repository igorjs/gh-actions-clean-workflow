name: Clean Logs (Manual)

on:
  workflow_dispatch:
    inputs:
      runs_older_than:
        description: "The amount of days old to delete"
        default: "7"
        required: false
      runs_to_keep:
        description: "The amount of latest workflows runs to keep"
        default: "5"
        required: false
      workflow_names:
        description: "Comma-separated workflow names to filter (empty = all)"
        default: ""
        required: false
      dry_run:
        description: "Dry run mode (preview only)"
        type: boolean
        default: true
        required: false

permissions: {}

jobs:
  clean-logs:
    name: "Clean Logs (Manual)"
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Clean workflow runs
        id: clean
        uses: igorjs/gh-actions-clean-workflow@5fa2e3a4fdd40e3e7098645a0b8df08624352e5e # v7
        with:
          runs_older_than: ${{ github.event.inputs.runs_older_than || '7' }}
          runs_to_keep: ${{ github.event.inputs.runs_to_keep || '5' }}
          workflow_names: ${{ github.event.inputs.workflow_names || '' }}
          dry_run: ${{ github.event.inputs.dry_run == 'true' }}

      - name: Display cleanup results
        env:
          TOTAL_RUNS_FOUND: ${{ steps.clean.outputs.total-runs-found }}
          RUNS_DELETED: ${{ steps.clean.outputs.runs-deleted }}
          RUNS_FAILED: ${{ steps.clean.outputs.runs-failed }}
          TOTAL_API_REQUESTS: ${{ steps.clean.outputs.total-api-requests }}
          SUCCESSFUL_REQUESTS: ${{ steps.clean.outputs.successful-requests }}
          FAILED_REQUESTS: ${{ steps.clean.outputs.failed-requests }}
          RETRY_ATTEMPTS: ${{ steps.clean.outputs.retry-attempts }}
          RATE_LIMIT_HITS: ${{ steps.clean.outputs.rate-limit-hits }}
          CIRCUIT_BREAKER_TRIPS: ${{ steps.clean.outputs.circuit-breaker-trips }}
        run: |
          echo "=== Cleanup Results ==="
          echo "Total runs found: $TOTAL_RUNS_FOUND"
          echo "Runs deleted: $RUNS_DELETED"
          echo "Runs failed: $RUNS_FAILED"
          echo ""
          echo "=== API Metrics ==="
          echo "Total API requests: $TOTAL_API_REQUESTS"
          echo "Successful requests: $SUCCESSFUL_REQUESTS"
          echo "Failed requests: $FAILED_REQUESTS"
          echo "Retry attempts: $RETRY_ATTEMPTS"
          echo "Rate limit hits: $RATE_LIMIT_HITS"
          echo "Circuit breaker trips: $CIRCUIT_BREAKER_TRIPS"

      - name: Check for failures
        if: steps.clean.outputs.runs-failed != '0'
        env:
          RUNS_FAILED: ${{ steps.clean.outputs.runs-failed }}
        run: |
          echo "Warning: $RUNS_FAILED runs failed to delete"
          echo "Check the logs above for details"
