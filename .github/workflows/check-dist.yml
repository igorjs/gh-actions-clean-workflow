# `dist/index.js` is a special file in Actions.
# When you reference an action with `uses:` in a workflow,
# `index.js` is the code that will run.
# For our project, we generate this file through a build process from other source files.
#
# dist/ is gitignored on main and every regular branch: it is only ever
# committed on tagged release commits, built there by the release pipeline
# (see "Releasing" in CONTRIBUTING.md). This workflow is the supply-chain
# check for that: on every pushed release tag, it rebuilds from that tag's
# own source and fails if the committed dist/ doesn't match byte-for-byte,
# so a tag consumers actually `uses:` can never silently diverge from its
# source.
name: Check Dist

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies and Rebuild the dist/ directory
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Compare the expected and actual dist/ directories
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "::error::dist/ committed on this release tag does not match a fresh build of its own source. The release pipeline's build step is out of sync with source."
            git diff --name-only
            exit 1
          fi
          echo "dist/ matches this tag's source."
